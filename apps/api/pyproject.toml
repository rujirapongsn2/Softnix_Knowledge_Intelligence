[project]
name = "softnix-knowledge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0", "uvicorn[standard]==0.51.0", "sqlalchemy==2.0.51", "pydantic-settings==2.14.2",
  "python-multipart==0.0.32", "PyJWT==2.13.0", "argon2-cffi==25.1.0", "httpx==0.28.1",
  "markitdown==0.1.6", "python-docx==1.2.0", "beautifulsoup4==4.15.0", "psycopg[binary]==3.3.4", "alembic==1.18.5", "pgvector==0.5.0", "redis==8.0.1"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires external services"]
[tool.ruff]
line-length = 110
lint.ignore = ["E701", "E702", "E402"]
[tool.setuptools.packages.find]
include = ["app*"]
