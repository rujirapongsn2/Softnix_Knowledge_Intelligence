services:
  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      LOG_QUERY_TEXT: "false"
  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_QUERY_TEXT: "false"
  migrate:
    environment: {APP_ENV: production}
  web: {restart: unless-stopped}
  postgres: {restart: unless-stopped}
  redis: {restart: unless-stopped}
  neo4j: {restart: unless-stopped}
  lightrag: {restart: unless-stopped}
