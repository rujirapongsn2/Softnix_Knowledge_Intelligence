# Shared build definition for api/worker/migrate: the context is the repo
# root, and the anydoc fork (a sibling checkout at ../Anydoc-ocr) is mounted
# as an additional named build context so its wheel can be baked in without
# copying the tree into this repo.
x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  additional_contexts:
    anydoc: ${ANYDOC_DIR:-../Anydoc-ocr}
  args:
    ANYDOC_SRC: /

services:
  api:
    build: *api-build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://skip:skip@postgres:5432/skip
      REDIS_URL: redis://redis:6379/0
      FILE_STORAGE_PATH: /data/files
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-now}
    volumes: [files:/data/files]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      neo4j: {condition: service_started}
      lightrag: {condition: service_started}
    ports: ["${API_PORT:-8001}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: *api-build
    command: python -m app.worker
    restart: unless-stopped
    # Job claims are atomic (FOR UPDATE SKIP LOCKED) with one running job per
    # document, so several replicas share the queue safely.  Keep this in step
    # with LightRAG's MAX_PARALLEL_INSERT below.
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://skip:skip@postgres:5432/skip
      REDIS_URL: redis://redis:6379/0
      FILE_STORAGE_PATH: /data/files
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-now}
    volumes: [files:/data/files]
    depends_on: [api]
  migrate:
    build: *api-build
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://skip:skip@postgres:5432/skip
    depends_on: [postgres]
  web:
    build:
      context: ./apps/web
      args:
        MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
    restart: unless-stopped
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
    depends_on: [api]
    ports: ["${WEB_PORT:-8081}:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment: {POSTGRES_DB: skip, POSTGRES_USER: skip, POSTGRES_PASSWORD: skip}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skip -d skip"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  neo4j:
    image: neo4j@sha256:4bae36aff76271e27fd6a6ed0835413f86a284cd179cfb1cb7d188f5f7533aca
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change-me-now}"
    volumes: [neo4j:/data]
  lightrag:
    # 1.5.4. The env names below are the ones this version reads.
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag@sha256:de09cd75e32b6b45b104625a9fb229f84f3dec4827ecffc825aa4438b196cbe6}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LLM_BASE_URL:-${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}}
      LLM_BINDING_API_KEY: ${LLM_API_KEY:-${OPENROUTER_API_KEY}}
      # LIGHTRAG_LLM_MODEL lets graph extraction run on a cheaper model than LLM_MODEL.
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-${LLM_MODEL:-${OPENROUTER_LLM_MODEL:-anthropic/claude-sonnet-5.5}}}
      KEYWORD_LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-${LLM_MODEL:-${OPENROUTER_LLM_MODEL:-anthropic/claude-sonnet-5.5}}}
      QUERY_LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-${LLM_MODEL:-${OPENROUTER_LLM_MODEL:-anthropic/claude-sonnet-5.5}}}
      # LightRAG cannot add the EMBEDDING_*_PREFIX task prompts the api uses, so its vectors are
      # unprefixed (measured: unprefixed embeddinggemma is about as good as the old OpenAI model).
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BASE_URL}
      # The openai client refuses an empty key; llama-server without --api-key ignores it.
      EMBEDDING_BINDING_API_KEY: ${EMBEDDING_API_KEY:-none}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma-2}
      EMBEDDING_DIM: ${EMBEDDING_DIMENSION:-768}
      ENTITY_EXTRACTION_USE_JSON: "true"
      # Cap LightRAG's internal fan-out so one large document cannot exhaust
      # the upstream LLM provider's in-flight request budget (402 observed
      # when 13 docs ingested in parallel: internal parallelism multiplies
      # to >40 in-flight calls). Review M1: process-local semaphore in the
      # SKI worker cannot control this; the lever is here.
      # Raised with the worker replicas (3): three documents index side by side
      # while MAX_ASYNC still caps in-flight LLM calls at 4 in total.
      MAX_PARALLEL_INSERT: "3"
      # In-flight LLM calls of LightRAG, the limit on indexing speed (71 legal documents an hour at 4 in the pilot).
      MAX_ASYNC: ${LIGHTRAG_MAX_ASYNC:-4}
      EMBEDDING_FUNC_MAX_ASYNC: "4"
      LIGHTRAG_PARSER: "*:native-teP,*:legacy-R"
      VLM_PROCESS_ENABLE: "false"
      # The file-backed defaults hold every store in memory and rewrite it whole on each
      # document, which does not scale past a few hundred documents. Setting these four back
      # to JsonKVStorage/NanoVectorDBStorage/JsonDocStatusStorage/NetworkXStorage in .env
      # reads the files left in the lightrag volume again.
      LIGHTRAG_KV_STORAGE: ${LIGHTRAG_KV_STORAGE:-PGKVStorage}
      LIGHTRAG_VECTOR_STORAGE: ${LIGHTRAG_VECTOR_STORAGE:-PGVectorStorage}
      LIGHTRAG_DOC_STATUS_STORAGE: ${LIGHTRAG_DOC_STATUS_STORAGE:-PGDocStatusStorage}
      LIGHTRAG_GRAPH_STORAGE: ${LIGHTRAG_GRAPH_STORAGE:-Neo4JStorage}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: skip
      POSTGRES_PASSWORD: skip
      POSTGRES_DATABASE: skip
      POSTGRES_WORKSPACE: lightrag
      # Postgres allows 100 connections and the api and workers pool their own; LightRAG defaults to 50.
      POSTGRES_MAX_CONNECTIONS: 20
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-now}
      # Community edition has only the default database, and the label keeps LightRAG's nodes apart from KnowledgeEntity.
      NEO4J_DATABASE: neo4j
      NEO4J_WORKSPACE: lightrag
    volumes: [lightrag:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
volumes: {postgres: {}, redis: {}, neo4j: {}, files: {}, lightrag: {}}
